name: Build platform releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x64
            executable: build/package/CameraBridge/CameraBridge-cli.exe
          - runner: ubuntu-22.04
            target: linux-x64
            executable: build/package/CameraBridge/CameraBridge-cli
          - runner: macos-15-intel
            target: macos-x64
            executable: build/package/CameraBridge/CameraBridge-cli
          - runner: macos-15
            target: macos-arm64
            executable: build/package/CameraBridge/CameraBridge-cli
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test source and documents
        run: |
          python dashboard/build_panels.py
          python -m unittest discover -v
          python tools/check_docs.py
      - name: Install desktop dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Install Linux desktop libraries
        if: matrix.target == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0
      - name: Test desktop lifecycle
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/smoke_tray.py
      - name: Test camera setup in a browser
        if: matrix.target == 'linux-x64'
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python tools/smoke_setup.py
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Build native package
        run: python tools/build_release.py --target ${{ matrix.target }}
      - name: Test packaged program
        run: python tools/smoke_release.py ${{ matrix.executable }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/*
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --prerelease --title "CameraBridge $GITHUB_REF_NAME" --notes-file docs/release-notes.md
