name: Build platform releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop_debug:
    if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-desktop.txt
      - run: python tools/smoke_tray.py
        env:
          QT_QPA_PLATFORM: offscreen
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --json id --jq .id > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease --title "CameraBridge $GITHUB_REF_NAME" --notes-file docs/release-notes.md
          fi
  build:
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x64
            executable: build/package/CameraBridge/CameraBridge-cli.exe
          - runner: ubuntu-22.04
            target: linux-x64
            executable: build/package/CameraBridge/CameraBridge-cli
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test source and documents
        run: |
          python dashboard/build_panels.py
          python -m unittest discover -v
          python tools/check_docs.py
      - name: Install desktop dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Install Linux desktop libraries
        if: matrix.target == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0
      - name: Test desktop lifecycle
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/smoke_tray.py
      - name: Test camera setup in a browser
        if: matrix.target == 'linux-x64'
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python tools/smoke_setup.py
          python tools/smoke_sony_dashboard.py
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Build Sony SDK adapter
        run: python tools/build_sony.py
      - name: Build native package
        run: python tools/build_release.py --target ${{ matrix.target }}
      - name: Test packaged program
        run: python tools/smoke_release.py ${{ matrix.executable }}
      - name: Upload tested release files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --clobber
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
