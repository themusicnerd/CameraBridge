name: Check desktop startup
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Native runner
        type: choice
        options: [macos-15, macos-15-intel]
        default: macos-15
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-desktop.txt
      - run: python tools/smoke_tray.py
        env:
          QT_QPA_PLATFORM: offscreen
