<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CameraBridge · Sony</title>
<style>*{box-sizing:border-box}body{margin:0;background:#25282e;color:#e2e4e9;font:17px system-ui}header{display:flex;align-items:center;gap:18px;padding:14px 22px;background:#2c3037}h1{font-size:23px;margin:0}header strong{margin-left:auto;font:700 29px Georgia;letter-spacing:3px}a{color:#8bd3ff}button,input,select{min-height:52px;font:inherit;border:0;border-radius:5px;padding:9px 15px;background:#494f5b;color:#fff}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4;cursor:default}button.active{background:#7433bd}button.stop{background:#a23d4c}input[type=range]{width:100%;padding:0;accent-color:#b08aee;min-height:70px;touch-action:pan-y}input[type=range]::-webkit-slider-thumb{appearance:none;width:44px;height:44px;border-radius:50%;background:#b08aee}input[type=range]{-webkit-appearance:none;background:transparent}input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:#49505c}input[type=range]::-webkit-slider-thumb{margin-top:-16px}main{padding:16px;max-width:1500px;margin:auto}.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.top input{max-width:200px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}.card{background:#2c3037;padding:18px;border-radius:7px;min-height:185px}.card h2{font-size:17px;margin:0 0 12px}.value{color:#a9bbc8;min-height:26px;font-size:14px}#status{min-height:30px;margin:12px 0}#tally{padding:12px 0}.jog{display:flex;gap:10px}.jog button{flex:1;min-height:70px}#notice{font-size:14px;color:#c8c6c0}details{margin-top:12px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){.grid{grid-template-columns:1fr}header{flex-wrap:wrap}}
</style><header><h1>CameraBridge / Sony camera control</h1><a href="/">Open CameraBridge setup</a><img src="/assets/sony.png" alt="Sony" width="150" height="29" style="margin-left:auto"></header><main>
<div class="top"><select id="camera" aria-label="Camera"></select><input id="username" placeholder="Bridge username" autocomplete="username"><input id="password" type="password" placeholder="Bridge password" autocomplete="current-password"><button id="login">Sign in</button><button id="logout">Sign out</button><button id="stop" class="stop">STOP LENS</button></div>
<div id="status" role="status">Sign in to load camera feedback.</div><p id="notice">PXW-Z200 lens and paint control. Controls use the camera's available values and current mode. This camcorder has no pan/tilt motors.</p>
<div class="top" id="tally"><button data-tally="program">Tally: PROGRAM</button><button data-tally="preview">Tally: PREVIEW</button><button data-tally="off">Tally: OFF</button><span id="tallystate"></span></div>
<div class="grid" id="controls"></div><details><summary>Connection and tally details</summary><pre id="diagnostics"></pre></details></main>
<script>
let token='',state={},generation=null,active=null,jogTimer=null,polling=false,jogEpoch=0;
const $=id=>document.getElementById(id),report=e=>$('status').textContent=e.message||e;
async function api(path,data){const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(data||{})});const v=await r.json();if(!r.ok)throw Error(v.error||r.status);return v}
function selected(){return $('camera').value}function command(action,data={}){return api('command',{camera:selected(),action,data})}
$('login').onclick=async()=>{try{const v=await api('login',{username:$('username').value,password:$('password').value});token=v.token;$('password').value='';await refresh()}catch(e){report(e)}};
async function stop(){jogEpoch++;clearInterval(jogTimer);jogTimer=null;if(token&&selected())try{await command('stop')}catch(e){report(e)}}
$('stop').onclick=stop;$('logout').onclick=async()=>{await stop();if(token)await api('logout');token='';active=null;$('controls').replaceChildren();report('Signed out')};
$('camera').onchange=async()=>{clearInterval(jogTimer);jogTimer=null;if(active)await api('command',{camera:active,action:'stop'}).catch(report);active=null;generation=null;await refresh()};
function control(key,p,c){let card=document.createElement('div');card.className='card';let title=document.createElement('h2');title.textContent=p.label;card.append(title);let value=document.createElement('div');value.className='value';value.textContent=(p.value??'—')+' · '+p.confirmation;card.append(value);const editable=p.writable&&p.confirmation==='confirmed'&&!c.locked;
 let field;if(p.allowed?.length){field=document.createElement('select');for(const v of p.allowed){let o=document.createElement('option');o.value=v;o.textContent=key.endsWith('_auto')||key==='wb_mode'?(v===1?'Auto':v===2?'Manual':String(v)):String(v);field.append(o)}}else{field=document.createElement('input');field.type=p.high-p.low<100000?'range':'number';field.min=p.low;field.max=p.high;field.step=p.step||1}
 field.setAttribute('aria-label',p.label);field.value=p.value??p.low;field.disabled=!editable;field.oninput=()=>value.textContent=field.value+' · selected';field.onchange=()=>command('write',{parameter:key,value:Number(field.value)}).then(()=>report(p.label+' queued; waiting for readback')).catch(report);card.append(field);return card}
function lens(c,axis,title,left,right){const card=document.createElement('div');card.className='card';const h=document.createElement('h2');h.textContent=title;card.append(h);const row=document.createElement('div');row.className='jog';for(const [label,sign] of [[left,-1],[right,1]]){const b=document.createElement('button');b.textContent=label;b.disabled=!token||c.locked;b.onpointerdown=async e=>{b.setPointerCapture(e.pointerId);const epoch=++jogEpoch;try{const claim=await command('claim');if(epoch!==jogEpoch||!b.hasPointerCapture(e.pointerId))return;generation=claim.generation;const move=()=>command('move',{generation,[axis]:sign*24}).catch(async e=>{await stop();report(e)});await move();if(b.hasPointerCapture(e.pointerId))jogTimer=setInterval(move,180);else await stop()}catch(e){report(e)}};for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,stop);row.append(b)}card.append(row);return card}
async function refresh(){if(!token||polling)return;polling=true;try{state=await api('state');const cameras=state.cameras.filter(c=>c.manufacturer==='Sony'),id=selected();if(cameras.map(c=>c.id).join()!==Array.from($('camera').options,o=>o.value).join()){$('camera').replaceChildren(...cameras.map(c=>{let o=document.createElement('option');o.value=c.id;o.textContent='CAM '+c.number+' · '+c.name;return o}));if(cameras.some(c=>c.id===id))$('camera').value=id}const c=cameras.find(c=>c.id===selected());if(!c){report('No enabled Sony cameras. Add one in CameraBridge setup.');return}active=c.id;$('status').textContent=c.name+' · '+c.model+' · '+c.health+(c.error?' · '+c.error:'');const tally=c.tally||{};$('tallystate').textContent=(tally.enabled?'Enabled':'Disabled')+' · '+tally.status+(tally.error?' · '+tally.error:'');document.querySelectorAll('[data-tally]').forEach(b=>b.disabled=!tally.enabled);$('diagnostics').textContent=JSON.stringify({host:c.host,tally:c.tally,owner:c.owner},null,2);if(!jogTimer&&!$('controls').contains(document.activeElement)){$('controls').replaceChildren(lens(c,'zoom','ZOOM · HOLD TO MOVE','WIDE','TELE'),lens(c,'focus','FOCUS · HOLD TO MOVE','NEAR','FAR'));for(const [k,p]of Object.entries(c.parameters))$('controls').append(control(k,p,c))}}catch(e){report(e);await stop()}finally{polling=false}}
document.querySelectorAll('[data-tally]').forEach(b=>b.onclick=()=>command('tally',{program:b.dataset.tally==='program',preview:b.dataset.tally==='preview'}).then(v=>report('Tally '+v.status)).catch(report));
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});window.addEventListener('blur',stop);setInterval(refresh,1000);
</script></html>
